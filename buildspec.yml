version: 0.2

env:
  variables:
    LINT_IMAGE_NAME: "mxk77/titra:lint"
    TEST_IMAGE_NAME: "mxk77/titra:test"
    FINAL_IMAGE_BASE: "mxk77/titra_app"
    MASTER_BRANCH: "master"
    RELEASE_REGEX: "^release/.*"
    HOTFIX_REGEX: "^hotfix/.*"
    APP_VERSION: "latest" # or set a semantic version; can be overridden in project settings

phases:
  pre_build:
    commands:
      - echo "Using application version: $APP_VERSION"
      # Retrieve the AWS account ID.
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      # Build the ECR repository URI for the final image.
      - export ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${FINAL_IMAGE_BASE}
      - echo "Logging in to Amazon ECR at $ECR_URI..."
      - aws --version
      # Log into ECR using AWS CLI v2.
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI
      - echo "Pulling previous image for cache (if available)..."
      - docker pull $ECR_URI:$APP_VERSION || true

  build:
    commands:
      - echo "Determining if Lint and Test stages should run based on branch: $BRANCH_NAME"
      - bash -c 'if [[ "$BRANCH_NAME" == "$MASTER_BRANCH" || "$BRANCH_NAME" =~ $RELEASE_REGEX || "$BRANCH_NAME" =~ $HOTFIX_REGEX ]]; then echo "Skipping Lint and Test stages for branch: $BRANCH_NAME"; export SKIP_TESTS=true; else export SKIP_TESTS=false; fi'
      # Create a host folder for reports.
      - mkdir -p reports
      - bash -c 'if [ "$SKIP_TESTS" = "false" ]; then echo "Building lint image..."; docker build -t $LINT_IMAGE_NAME --target=lint -f Dockerfile .; fi'
      - bash -c 'if [ "$SKIP_TESTS" = "false" ]; then echo "Running lint container to generate report..."; docker run --rm $LINT_IMAGE_NAME sh -c "cat /app/reports/eslint-report.xml" > reports/eslint-report.xml || true; else echo "Lint stage skipped for branch: $BRANCH_NAME"; fi'
      - bash -c 'if [ "$SKIP_TESTS" = "false" ]; then echo "Building test image..."; docker build -t $TEST_IMAGE_NAME --target=test -f Dockerfile .; fi'
      - bash -c 'if [ "$SKIP_TESTS" = "false" ]; then echo "Running test container to generate report..."; docker run --rm $TEST_IMAGE_NAME sh -c "cat /app/reports/test-results.xml" > reports/test-results.xml || true; else echo "Test stage skipped for branch: $BRANCH_NAME"; fi'
      - echo "Building final production image with cache..."
      # Use the pulled image as a cache source when building the final image.
      - docker build --cache-from $ECR_URI:$APP_VERSION --tag $ECR_URI:$APP_VERSION --target=final -f Dockerfile .
      - bash -c 'if [[ "$BRANCH_NAME" == "$MASTER_BRANCH" || "$BRANCH_NAME" =~ $RELEASE_REGEX || "$BRANCH_NAME" =~ $HOTFIX_REGEX ]]; then echo "Tagging and pushing final image to ECR..."; docker tag $ECR_URI:$APP_VERSION $ECR_URI:latest; docker push $ECR_URI:$APP_VERSION; docker push $ECR_URI:latest; else echo "Push stage skipped for branch: $BRANCH_NAME"; fi'

  post_build:
    commands:
      - echo "Build phase complete for branch: $BRANCH_NAME"

reports:
  TestReports:
    files:
      - "test-results.xml"
    base-directory: "reports"
  LintReports:
    files:
      - "eslint-report.xml"
    base-directory: "reports"
