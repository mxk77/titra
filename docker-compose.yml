version: '3'
services:
  titra:
    image: ${DOCKER_USERNAME}/titra_app:latest
    depends_on:
      - mongodb
    environment:
      - ROOT_URL=${ROOT_URL}
      - MONGO_URL=${MONGO_URL}
      - PORT=${PORT}
    ports:
      - "${HOST_PORT}:3000"
    restart: always
  mongodb:
    image: mongo:4.4
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    volumes:
      - titra_db_volume:/data/db
volumes:
  titra_db_volume: